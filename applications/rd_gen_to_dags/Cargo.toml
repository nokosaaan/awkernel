[package]
name = "rd_gen_to_dags"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
yaml-peg = { version = "1.0.8", default-features = false, features = ["serde"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[dependencies.awkernel_lib]
path = "../../awkernel_lib"
default-features = false

[dependencies.awkernel_async_lib]
path = "../../awkernel_async_lib"
default-features = false

[dev-dependencies]
rand = "0.9"

[features]
default = ["milliseconds"]

# Time Unit 
seconds = []
milliseconds = []
microseconds = []
nanoseconds = []

# Scheduler Type
prioritized_fifo = []

# Admission policy: federated (default, admit_dag), vfed (admit_one), laxity
# (plain GEDF + a self-derived static Laxity-Based node priority -- see
# build_dag.rs's own doc comment on that arm for why it has no published
# primary source), or dagfluid (DAG-Fluid's static admission test only --
# dispatch is a ClusteredEDF-over-ceil(required_capacity)-cores placeholder,
# not the papers' fluid-rate DP-Fair/DP-Wrap execution; see build_dag.rs's
# own doc comment on that arm). Mutually exclusive; see build_dag.rs's
# feature-gated admission call site.
vfed = []
laxity = []
dagfluid = []

# For test
std = ["awkernel_lib/std", "awkernel_async_lib/std"]

