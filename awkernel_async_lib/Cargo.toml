[package]
name = "awkernel_async_lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pin-project = "1"
log = "0.4"
array-macro = "2.1"
fixedbitset = "0.5.7"
async-trait = "0.1"
async-recursion = "1.1"
affinity_btree_queue = { workspace = true }

[dependencies.futures]
version = "0.3"
default-features = false
features = ["alloc", "async-await"]

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["alloc", "async-await", "async-await-macro"]

[dependencies.awkernel_lib]
path = "../awkernel_lib"
default-features = false

[dependencies.awkernel_futures_macro]
path = "../awkernel_futures_macro"

[dependencies.smoltcp]
path = "../smoltcp"
default-features = false
features = ["awkernel"]

[dev-dependencies]
rand = "0.9"

[features]
default = []
std = ["awkernel_lib/std", "no_preempt"]
no_preempt = []
spinlock = ["awkernel_lib/spinlock"]
clippy = []
perf = []
period-index-propagation = ["perf"]
# DAG-Fluid's per-core dispatch, event-driven variant (③): a segment
# arrives when the previous one's completion gate finishes, and the planner
# re-plans at every arrival (see `dag_sched::planner`). Without it the
# dispatch is time-driven (①).
dagfluid_event = []
# DAG-Fluid's per-core dispatch, per node: every slot of the plan names one
# node (one thread of a segment, as in the papers) instead of a whole DAG,
# and a CPU runs only that node during the slot (see `dag_sched::planner`
# and `scheduler::dp_wrap`). Time-driven (①) only.
dagfluid_node = []
# Count each task's CPU time and offer `task::cpu_time::spin_cpu_time`, a
# busy loop that runs for a given amount of CPU time instead of a given
# amount of calibrated work (see that module).
cpu_time_work = []
